<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 250px;
        margin: 0;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #ffffff;
        color: #1c1e21;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #18191a;
          color: #e4e6eb;
        }
      }
      h2 {
        font-size: 14px;
        margin: 0 0 8px 0;
        font-weight: 700;
      }
      p {
        font-size: 12px;
        line-height: 1.4;
        margin: 0 0 16px 0;
        color: #65676b;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #b0b3b8;
        }
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: #00a400;
        font-size: 11px;
        background-color: #eafbe7;
        padding: 4px 8px;
        border-radius: 12px;
        margin-bottom: 14px;
      }
      @media (prefers-color-scheme: dark) {
        .status {
          background-color: #1a331a;
          color: #31a24c;
        }
      }
      .status-dot {
        height: 6px;
        width: 6px;
        background-color: currentColor;
        border-radius: 50%;
        display: inline-block;
      }
      .footer {
        border-top: 1px solid #ced0d4;
        padding-top: 12px;
        font-size: 11px;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        .footer {
          border-top: 1px solid #3e4042;
        }
      }
      .link {
        color: #0064d2;
        text-decoration: none;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        .link {
          color: #2e89ff;
        }
      }
      .link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h2>Return Facebook Likes</h2>
    <div class="status">
      <span class="status-dot"></span>
      Active on Facebook
    </div>
    <p>
      Here to restore comment reaction counts without the need for you to hover
      over them!:)
    </p>
    <div class="footer">
      Facing issues or has Facebook updated?<br />
      <a
        href="https://github.com/S4adam/return-facebook-likes"
        target="_blank"
        class="link"
        >Report on GitHub</a
      >
    </div>
  </body>
</html>
